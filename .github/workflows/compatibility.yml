name: Compatibility Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  compatibility:
    name: Java ${{ matrix.java }} / Maven ${{ matrix.maven }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full invoker suite is slow; use one representative cell for PR #17 verification.
        include:
          - java: '8'
            maven: '3.9.9'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Download Maven ${{ matrix.maven }}
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/${{ matrix.maven }}/binaries/apache-maven-${{ matrix.maven }}-bin.tar.gz
          tar xf apache-maven-${{ matrix.maven }}-bin.tar.gz -C "$HOME"
          echo "$HOME/apache-maven-${{ matrix.maven }}/bin" >> "$GITHUB_PATH"

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ matrix.java }}-${{ matrix.maven }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ matrix.java }}-${{ matrix.maven }}-
            m2-

      - name: Verify Maven version
        run: mvn --version

      - name: Build and run integration tests
        run: mvn --errors --batch-mode --show-version -Dinvoker.streamLogsOnFailures verify -P run-its -Dmaven.javadoc.skip=true
