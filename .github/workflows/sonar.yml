name: Sonar

on:
  # default branch only: a PR branch is already analysed through pull_request, and a second analysis of the
  # same SHA posts a second check run under the required context.
  push:
    branches: [ octopus ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its analysis. A running default branch analysis is never cancelled; a
# superseded pending one may be dropped, and the newest default branch SHA is always analysed.
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-sonar.yml@v3.4.1
    with:
      java-version: '8'
      quality-gate-wait: true
    secrets: inherit
