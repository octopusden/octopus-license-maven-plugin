name: Maven Compile & UT

# Pull requests run this through merge-gate.yml, not on their own.
on:
  push:
    branches: [ octopus ]
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-build.yml@v2.3.5
    with:
      java-version: '8'
      mvn-parameters: '-P run-its -Dinvoker.streamLogsOnFailures verify'
